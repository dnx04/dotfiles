[tools]
age = "latest"
bun = "latest"
gh = "latest"
go = "latest"
node = "latest"

[settings.upgrade]
auto_prune = true

[dotfiles]
"~/.bashrc" = { mode = "track" }
"~/.config/git/config" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/tmux/tmux.conf" = { mode = "track" }
"~/.omp/agent/config.yml" = { mode = "track" }
"~/.omp/agent/models.yml" = { mode = "track", encrypt = true }

[history.encryption]
recipients = [
	"age17zp0u74ar4ta0ggtcn3lj4avqkp84qt2cqa0uczvkju0xcpldezsalrr0z"
]

[bootstrap.services.mise-history]
builtin = "history-watch"
